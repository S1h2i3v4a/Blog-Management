<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Blog Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="container my-auto py-5" style="max-width: 440px;">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="text-center mb-3 fw-bold">Reset Password</h3>

      <div id="alertBox"></div>

      <form id="resetForm">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="password" id="password" class="form-control" required minlength="6" placeholder="Enter new password">
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required minlength="6" placeholder="Confirm new password">
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 mb-3" id="submitBtn">Update Password</button>

        <div class="text-center small">
          <a href="login.html">Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const alertBox = document.getElementById("alertBox");
    const form = document.getElementById("resetForm");

    if (!token) {
      alertBox.innerHTML = `<div class="alert alert-danger">Invalid or missing reset token. <a href="forgot-password.html">Request a new link</a></div>`;
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      const submitBtn = document.getElementById("submitBtn");

      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;

      if (password !== confirmPassword) {
        alertBox.innerHTML = `<div class="alert alert-danger">Passwords do not match.</div>`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      try {
        const res = await fetch(`${API_BASE_URL}/api/user/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password, confirmPassword })
        });
        const data = await res.json();

        if (data.success) {
          alertBox.innerHTML = `<div class="alert alert-success">Password reset successfully! Redirecting to login...</div>`;
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Failed to reset password."}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
        }
      } catch (err) {
        console.error("Reset error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error connecting to backend server.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
