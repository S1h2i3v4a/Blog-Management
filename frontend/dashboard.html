<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Admin Dashboard - Blog Management System</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .post-card-img { height: 180px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="wrapper d-flex align-items-stretch">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="custom-menu">
        <button type="button" id="sidebarCollapse" class="btn btn-primary">
          <i class="fa fa-bars"></i>
          <span class="sr-only">Toggle Menu</span>
        </button>
      </div>
      <h1><a href="index.html" class="logo">BMS Admin</a></h1>
      <ul class="list-unstyled components mb-5">
        <li>
          <a href="index.html"><span class="fa fa-home mr-3"></span> Homepage</a>
        </li>
        <li class="active">
          <a href="dashboard.html"><span class="fa fa-user mr-3"></span> Dashboard</a>
        </li>
        <li>
          <a href="create-post.html"><span class="fa fa-sticky-note mr-3"></span> Create Post</a>
        </li>
        <li>
          <a href="profile.html"><span class="fa fa-cog mr-3"></span> My Profile</a>
        </li>
        <li>
          <a href="#" onclick="logout(); return false;"><span class="fa fa-paper-plane mr-3"></span> Logout</a>
        </li>
      </ul>
    </nav>

    <!-- Page Content -->
    <div id="content" class="p-4 p-md-5 pt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Admin Dashboard</h2>
        <a href="create-post.html" class="btn btn-primary"><i class="fa fa-plus mr-1"></i> New Post</a>
      </div>

      <div id="dashboardAlert"></div>

      <div id="postsRow" class="row">
        <div class="col-12 text-center py-5">
          <p class="text-muted">Loading posts...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="js/popper.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    if (!isLoggedIn() || !isAdmin()) {
      alert("Admin access required.");
      window.location.href = "login.html";
    }

    function getImageUrl(url) {
      if (!url) return null;
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      return API_BASE_URL + url;
    }

    const postsRow = document.getElementById("postsRow");
    const dashboardAlert = document.getElementById("dashboardAlert");

    // Socket.io for likes
    let socket;
    try {
      socket = io(API_BASE_URL);
      socket.on("post:updated", (data) => {
        const card = document.querySelector(`[data-post-id="${data.postId}"]`);
        if (!card) return;
        const likeCount = card.querySelector(".like-count");
        const dislikeCount = card.querySelector(".dislike-count");
        if (likeCount) likeCount.textContent = data.likes;
        if (dislikeCount) dislikeCount.textContent = data.dislikes;
      });
    } catch (e) {
      console.warn("Socket error", e);
    }

    async function loadDashboardPosts() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/dashboard`, {
          headers: authHeaders()
        });
        const data = await res.json();

        if (!data.success || !data.posts || data.posts.length === 0) {
          postsRow.innerHTML = `<div class="col-12"><p class="text-muted">No posts found yet. Click <strong>New Post</strong> above to create one!</p></div>`;
          return;
        }

        postsRow.innerHTML = data.posts.map(post => {
          const imgUrl = getImageUrl(post.imageUrl);
          const previewText = post.content ? (post.content.length > 90 ? post.content.substring(0, 90) + "..." : post.content) : "";

          return `
            <div class="col-md-4 mb-4" data-post-id="${post._id}">
              <div class="card h-100 shadow-sm border-0">
                ${imgUrl ? `<img src="${imgUrl}" class="card-img-top post-card-img" alt="${post.title}">` : ""}
                <div class="card-body">
                  <h5 class="card-title font-weight-bold">${post.title}</h5>
                  <p class="card-text text-muted small">${previewText}</p>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between align-items-center">
                  <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-success mr-1 like-btn" data-id="${post._id}">
                      👍 <span class="like-count">${post.likes || 0}</span>
                    </button>
                    <button class="btn btn-sm btn-outline-danger mr-2 dislike-btn" data-id="${post._id}">
                      👎 <span class="dislike-count">${post.dislikes || 0}</span>
                    </button>
                  </div>
                  <div>
                    <a href="edit-post.html?id=${post._id}" class="btn btn-sm btn-primary mr-1">Edit</a>
                    <button class="btn btn-sm btn-danger delete-post" data-id="${post._id}">Delete</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Dashboard fetch error:", err);
        postsRow.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error loading dashboard posts. Ensure backend is running.</div></div>`;
      }
    }

    loadDashboardPosts();

    // Event delegation for like, dislike, delete
    document.addEventListener("click", async (e) => {
      // Likes / Dislikes
      const likeBtn = e.target.closest(".like-btn");
      const dislikeBtn = e.target.closest(".dislike-btn");
      if (likeBtn || dislikeBtn) {
        const postId = (likeBtn || dislikeBtn).getAttribute("data-id");
        if (postId && socket) {
          socket.emit(likeBtn ? "post:like" : "post:dislike", { postId });
        }
        return;
      }

      // Delete Post
      const deleteBtn = e.target.closest(".delete-post");
      if (deleteBtn) {
        const postId = deleteBtn.getAttribute("data-id");
        if (!postId) return;

        if (!confirm("Are you sure you want to delete this post?")) return;

        try {
          const res = await fetch(`${API_BASE_URL}/api/admin/delete-post/${postId}`, {
            method: "DELETE",
            headers: authHeaders()
          });
          const data = await res.json();

          if (data.success) {
            const col = deleteBtn.closest('[data-post-id]');
            if (col) col.remove();
            dashboardAlert.innerHTML = `<div class="alert alert-success">Post deleted successfully!</div>`;
            setTimeout(() => dashboardAlert.innerHTML = "", 3000);
          } else {
            alert(data.message || "Failed to delete post.");
          }
        } catch (err) {
          console.error("Delete error:", err);
          alert("Error deleting post.");
        }
      }
    });
  </script>
</body>
</html>
