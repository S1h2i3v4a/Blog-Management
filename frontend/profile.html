<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile - Blog Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <header class="p-3 text-bg-dark">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-between">
        <a href="index.html" class="d-flex align-items-center text-white text-decoration-none">
          <span class="fs-4 fw-semibold"><i class="bi bi-journal-text me-2"></i>Blog Management System</span>
        </a>
        <div class="text-end">
          <a href="index.html" class="btn btn-outline-light me-2">Homepage</a>
          <span id="adminDashBtn" style="display:none;"><a href="dashboard.html" class="btn btn-outline-warning me-2">Dashboard</a></span>
          <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- PROFILE CONTENT -->
  <main class="container my-auto py-5" style="max-width: 540px;">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0 fw-bold"><i class="bi bi-person-circle me-2"></i>My Profile</h4>
      </div>

      <div class="card-body p-4">
        <div id="alertBox"></div>

        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Name</label>
            <input type="text" class="form-control" name="name" id="userName" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" name="email" id="userEmail" readonly style="background-color: #e9ecef;">
            <small class="text-muted">Email cannot be changed.</small>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <div>
              <span class="badge bg-secondary" id="userRole">user</span>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 mt-2" id="saveBtn">Update Profile</button>
        </form>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-4 mt-auto border-top bg-white text-center">
    <p class="text-muted mb-0">© 2026 Blog Management System</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = "login.html";
    }

    if (isAdmin()) {
      document.getElementById("adminDashBtn").style.display = "inline";
    }

    const alertBox = document.getElementById("alertBox");
    const nameInput = document.getElementById("userName");
    const emailInput = document.getElementById("userEmail");
    const roleBadge = document.getElementById("userRole");

    async function fetchProfile() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/profile`, {
          headers: authHeaders()
        });
        const data = await res.json();

        if (data.success && data.user) {
          nameInput.value = data.user.name || "";
          emailInput.value = data.user.email || "";
          roleBadge.textContent = data.user.role || "user";
          roleBadge.className = data.user.role === "admin" ? "badge bg-danger" : "badge bg-secondary";
          setUser(data.user);
        } else {
          alertBox.innerHTML = `<div class="alert alert-warning">${data.message || "Failed to load profile"}</div>`;
        }
      } catch (err) {
        console.error("Profile fetch error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error connecting to backend server.</div>`;
      }
    }

    fetchProfile();

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Updating...";

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();

      try {
        const res = await fetch(`${API_BASE_URL}/api/user/updateProfile`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders()
          },
          body: JSON.stringify({ name, email })
        });
        const data = await res.json();

        if (data.success) {
          alertBox.innerHTML = `<div class="alert alert-success">Profile updated successfully!</div>`;
          const current = getUser() || {};
          current.name = name;
          setUser(current);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Update failed."}</div>`;
        }
      } catch (err) {
        console.error("Profile update error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error updating profile.</div>`;
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Update Profile";
      }
    });
  </script>
</body>
</html>
