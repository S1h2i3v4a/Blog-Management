<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Setup - Blog Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="container my-5" style="max-width: 800px;">
    <h2 class="text-center mb-4 fw-bold">Blog Management System Setup</h2>

    <div id="alertBox"></div>

    <form id="setupForm" enctype="multipart/form-data">
      <div class="row">
        <!-- BLOG SETTINGS -->
        <div class="col-md-6 mb-4">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-dark text-white fw-bold py-3">1. Blog Information</div>
            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label">Blog Title</label>
                <input type="text" name="blog_title" class="form-control" required placeholder="My Awesome Blog">
              </div>

              <div class="mb-3">
                <label class="form-label">Blog Logo</label>
                <input type="file" name="blog_logo" class="form-control" accept="image/*">
                <small class="text-muted">Optional logo image.</small>
              </div>

              <div class="mb-3">
                <label class="form-label">Blog Description</label>
                <textarea name="description" class="form-control" rows="4" required placeholder="A short description about your blog..."></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- ADMIN USER -->
        <div class="col-md-6 mb-4">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-secondary text-white fw-bold py-3">2. Initial Admin Account</div>
            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label">Admin Name</label>
                <input type="text" name="name" class="form-control" required placeholder="Admin User">
              </div>

              <div class="mb-3">
                <label class="form-label">Admin Email</label>
                <input type="email" name="email" class="form-control" required placeholder="admin@example.com">
              </div>

              <div class="mb-3">
                <label class="form-label">Admin Password</label>
                <input type="password" name="password" class="form-control" required minlength="6" placeholder="Strong password">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-3">
        <button type="submit" class="btn btn-success px-5 py-2 fw-semibold fs-5" id="submitBtn">Complete Setup</button>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const alertBox = document.getElementById("alertBox");

    // Check if already set up
    async function checkSetup() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/blogSetup`);
        const data = await res.json();
        if (data.exists) {
          alertBox.innerHTML = `
            <div class="alert alert-info text-center">
              Blog has already been set up! <a href="login.html" class="fw-bold">Go to Login</a>
            </div>
          `;
          document.getElementById("setupForm").style.display = "none";
        }
      } catch (e) {
        console.warn("Could not check setup status", e);
      }
    }
    checkSetup();

    document.getElementById("setupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Setting up...";

      const formData = new FormData(e.target);

      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/blogSetup`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          alertBox.innerHTML = `<div class="alert alert-success">Blog set up successfully! Redirecting to login...</div>`;
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Setup failed."}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Complete Setup";
        }
      } catch (err) {
        console.error("Setup error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error connecting to backend server.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Complete Setup";
      }
    });
  </script>
</body>
</html>
