<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Post - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5" style="max-width: 760px;">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white py-3">
        <h4 class="mb-0 fw-bold">Edit Blog Post</h4>
      </div>

      <div class="card-body p-4">
        <div id="alertBox"></div>

        <form id="editPostForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Title</label>
            <input type="text" name="title" id="postTitle" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Content</label>
            <textarea name="content" id="postContent" class="form-control" rows="6" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Post Image (Upload new image)</label>
            <input type="file" id="imageFileInput" class="form-control" accept="image/*">
            <div id="uploadStatus" class="small mt-1 text-muted"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Image URL</label>
            <input type="text" name="imageUrl" id="imageUrlInput" class="form-control">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Tags (comma separated)</label>
            <input type="text" name="tags" id="postTags" class="form-control">
          </div>

          <div class="d-flex align-items-center">
            <button class="btn btn-primary px-4 py-2" type="submit" id="submitBtn">Save Changes</button>
            <a href="dashboard.html" class="btn btn-secondary ms-2 px-3 py-2">Back to Dashboard</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!isLoggedIn() || !isAdmin()) {
      alert("Admin access required.");
      window.location.href = "login.html";
    }

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get("id");
    const alertBox = document.getElementById("alertBox");
    const form = document.getElementById("editPostForm");
    const submitBtn = document.getElementById("submitBtn");
    const fileInput = document.getElementById("imageFileInput");
    const imageUrlInput = document.getElementById("imageUrlInput");
    const uploadStatus = document.getElementById("uploadStatus");

    if (!postId) {
      alertBox.innerHTML = `<div class="alert alert-danger">No post ID specified. <a href="dashboard.html">Back to Dashboard</a></div>`;
      form.style.display = "none";
    }

    // Load post data
    async function loadPostData() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/edit-post/${postId}`, {
          headers: authHeaders()
        });
        const data = await res.json();

        if (data.success && data.post) {
          const p = data.post;
          document.getElementById("postTitle").value = p.title || "";
          document.getElementById("postContent").value = p.content || "";
          imageUrlInput.value = p.imageUrl || "";
          document.getElementById("postTags").value = (p.tags && p.tags.length) ? p.tags.join(", ") : "";
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Failed to load post."}</div>`;
        }
      } catch (err) {
        console.error("Load post error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error connecting to backend server.</div>`;
      }
    }

    loadPostData();

    // Image Upload
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadStatus.innerHTML = `<span class="text-primary"><span class="spinner-border spinner-border-sm"></span> Uploading...</span>`;

      const formData = new FormData();
      formData.append("image", file);

      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/upload-post-image`, {
          method: "POST",
          headers: authHeaders(),
          body: formData
        });
        const data = await res.json();

        if (data.success && data.imageUrl) {
          imageUrlInput.value = data.imageUrl;
          uploadStatus.innerHTML = `<span class="text-success">✓ Image updated successfully!</span>`;
        } else {
          uploadStatus.innerHTML = `<span class="text-danger">Upload failed: ${data.message || "Error"}</span>`;
        }
      } catch (err) {
        console.error("Upload error:", err);
        uploadStatus.innerHTML = `<span class="text-danger">Upload error.</span>`;
      }
    });

    // Form Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";

      const payload = {
        title: form.title.value.trim(),
        content: form.content.value.trim(),
        imageUrl: imageUrlInput.value.trim(),
        tags: form.tags.value.trim()
      };

      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/update-post/${postId}`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders()
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alertBox.innerHTML = `<div class="alert alert-success">Post updated successfully! Redirecting...</div>`;
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Failed to update post."}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Save Changes";
        }
      } catch (err) {
        console.error("Update error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error connecting to backend server.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Save Changes";
      }
    });
  </script>
</body>
</html>
