<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Blog Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="container my-auto py-5" style="max-width: 420px;">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="text-center mb-3 fw-bold">Sign In</h3>
      <p class="text-center text-muted small mb-4">Blog Management System</p>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-dark w-100 py-2 mb-3" id="submitBtn">Login</button>

        <div class="d-flex justify-content-between small">
          <a href="forgot-password.html">Forgot password?</a>
          <a href="register.html">Create an account</a>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="index.html" class="text-secondary small">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.href = isAdmin() ? "dashboard.html" : "profile.html";
    }

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const email = form.email.value.trim();
      const password = form.password.value;

      try {
        const res = await fetch(`${API_BASE_URL}/api/user/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          setToken(data.token);
          setUser(data.user);

          alertBox.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
          setTimeout(() => {
            window.location.href = data.user.role === "admin" ? "dashboard.html" : "profile.html";
          }, 800);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Invalid credentials."}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        }
      } catch (err) {
        console.error("Login error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Could not connect to backend server.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
