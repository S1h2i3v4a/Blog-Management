<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - Blog Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="container my-auto py-5" style="max-width: 420px;">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="text-center mb-2 fw-bold">Forgot Password</h3>
      <p class="text-muted text-center small mb-4">Enter your registered email to receive a password reset link.</p>

      <div id="alertBox"></div>

      <form id="forgotForm">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="example@email.com">
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="submitBtn">Send Reset Link</button>

        <div class="text-center small">
          <a href="login.html">Remember your password? Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      const email = form.email.value.trim();

      try {
        const res = await fetch(`${API_BASE_URL}/api/user/forget-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          alertBox.innerHTML = `<div class="alert alert-success">${data.message || "Reset link sent! Please check your email inbox."}</div>`;
          form.reset();
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || "Failed to process request."}</div>`;
        }
      } catch (err) {
        console.error("Forgot password error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Error connecting to backend server.</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
