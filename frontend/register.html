<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Blog Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="container my-auto py-5" style="max-width: 420px;">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="text-center mb-3 fw-bold">Create Account</h3>
      <p class="text-center text-muted small mb-4">Blog Management System</p>

      <div id="alertBox"></div>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required placeholder="John Doe">
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
        </div>

        <button type="submit" class="btn btn-dark w-100 py-2 mb-3" id="submitBtn">Register</button>

        <div class="text-center small">
          <a href="login.html">Already have an account? Login</a>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="index.html" class="text-secondary small">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.href = isAdmin() ? "dashboard.html" : "profile.html";
    }

    const form = document.getElementById("registerForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;

      try {
        const res = await fetch(`${API_BASE_URL}/api/user/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          setToken(data.token);
          setUser(data.user);

          alertBox.innerHTML = `<div class="alert alert-success">Registration successful! Redirecting...</div>`;
          setTimeout(() => {
            window.location.href = data.user.role === "admin" ? "dashboard.html" : "profile.html";
          }, 800);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message || (data.errors && data.errors[0]?.msg) || "Registration failed."}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Register";
        }
      } catch (err) {
        console.error("Register error:", err);
        alertBox.innerHTML = `<div class="alert alert-danger">Could not connect to backend server.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
